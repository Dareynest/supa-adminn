<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Login — Darey Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .logo {
            text-align: center;
            margin-bottom: 35px;
        }
        .logo-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 10px;
        }
        .logo h1 {
            color: white;
            font-size: 1.6rem;
            font-weight: 700;
        }
        .logo p {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: border-color 0.3s, background 0.3s;
            outline: none;
        }
        input:focus {
            border-color: #667eea;
            background: rgba(255,255,255,0.12);
        }
        input::placeholder { color: rgba(255,255,255,0.3); }
        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.3s, transform 0.2s;
            letter-spacing: 0.5px;
        }
        .btn-login:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .error-msg {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.4);
            color: #ff6b7a;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
        }
        .error-msg.show { display: block; }
        .footer-text {
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 0.78rem;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <span class="logo-icon">🛡️</span>
            <h1>Darey Platform</h1>
            <p>Super Admin Access Only</p>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="dareynest@gmail.com" autocomplete="email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button class="btn-login" id="login-btn" onclick="login()">Sign In</button>

        <p class="footer-text">This portal is restricted to platform administrators only.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://xfuksmgdxmewqvhggugp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmdWtzbWdkeG1ld3F2aGdndWdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3MDkyMjUsImV4cCI6MjA4NTI4NTIyNX0.rceD8AkCnIteoe9J_x69IgmRD6oO-cQiWviZwPTPEiY';

        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // If already logged in, redirect to dashboard
        client.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                console.log('Already logged in → redirecting to dashboard');
                window.location.href = 'super-admin.html';  // ← Fixed with space
            }
        }).catch(err => console.error('Session check error:', err));

        // Allow Enter key to submit
        document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            const errorMsg = document.getElementById('error-msg');

            if (!email || !password) {
                showError('Please enter your email and password.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Signing in...';
            errorMsg.classList.remove('show');

            try {
                const { data, error } = await client.auth.signInWithPassword({ email, password });
                if (error) throw error;

                // Verify super admin role
                const { data: roleData, error: roleError } = await client
                    .from('user_roles')
                    .select('role')
                    .eq('user_id', data.user.id)
                    .single();

                if (roleError || !roleData || roleData.role !== 'super_admin') {
                    await client.auth.signOut();
                    throw new Error('Access denied. You are not a super admin.');
                }

                console.log('Login success → redirecting to dashboard');
                window.location.href = 'super-admin.html';  // ← Fixed with space

            } catch (e) {
                console.error('Login failed:', e);
                showError(e.message || 'Login failed. Please try again.');
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }

        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.textContent = msg;
            el.classList.add('show');
        }
    </script>
</body>
</html>
